name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Build
      run: cargo hack build --verbose --release --feature-powerset --exclude-features loom
    - name: Tests
      run: cargo hack test --verbose --release --lib --bins --tests --feature-powerset --exclude-features loom
    - name: Documentation tests
      run: cargo test --verbose --release --doc
    - name: No default hasher
      run: cargo test --verbose --release --lib --bins --tests --no-default-features
    - name: Non rand default seed
      run: cargo test --lib --no-default-features --features default-hasher hasher::test
    - name: Non rand without std
      run: cargo check --no-default-features --features default-hasher

    - name: Install thumb target
      run: rustup target add thumbv7em-none-eabi
    - name: 32-bit embedded check
      run: cargo check --target thumbv7em-none-eabi --no-default-features

    - name: Loom build
      run: cargo build --lib --bins --tests --no-default-features --features loom,default-hasher
    - name: Loom tests
      run: cargo test loom --lib --bins --tests --no-default-features --features loom,default-hasher
  
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.71"
          override: true
      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.37 --force --locked
      - name: Build
        run: cargo hack build --verbose --release --feature-powerset --exclude-features loom
      - name: Tests
        run: cargo hack test --verbose --release --lib --bins --tests --feature-powerset --exclude-features loom
      - name: Documentation tests
        run: cargo test --verbose --release --doc
      - name: No default hasher
        run: cargo test --verbose --release --lib --bins --tests --no-default-features
      - name: Non rand default seed
        run: cargo test --lib --no-default-features --features default-hasher hasher::test
      - name: Non rand without std
        run: cargo check --no-default-features --features default-hasher

      - name: Install thumb target
        run: rustup target add thumbv7em-none-eabi
      - name: 32-bit embedded check
        run: cargo check --target thumbv7em-none-eabi --no-default-features
